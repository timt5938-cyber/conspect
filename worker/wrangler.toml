name = "conspect-api"
main = "src/index.ts"
compatibility_date = "2026-02-01"
compatibility_flags = ["nodejs_compat"]

# Public (non-secret) configuration. Secrets live in Cloudflare via `wrangler secret put`.
[vars]
GEMINI_MODEL = "gemini-3.6-flash"
GEMINI_MODEL_FALLBACKS = "gemini-3.8-flash,gemini-3.5-flash,gemini-flash-latest"
SUPABASE_URL = "https://ddvzcqeunaappryvbuov.supabase.co"
SUPABASE_BUCKET = "conspectus-assets"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://conspect.ssskkkiiieee.bond,https://ssskkkiiieee.bond"

[observability]
enabled = true

# Rate limiting per client IP. Uncomment after creating the KV namespace:
#   wrangler kv namespace create RATE_LIMIT
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<paste-id-here>"

[env.production]
name = "conspect-api"
